<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="device-width, initial-scale=1.0">
        <meta charset="utf-8">
        <title>GalaxyTasks register</title>
        <link rel="stylesheet" href="register.css">
    </head>
    <body>
        <div id="section_slogan">
        <h1>GalaxyTasks</h1>
        <ol>
            <li>Gérez efficacement vos projets</li>
            <li>Structurez vos tâches</li>
            <li>Dans un environnement approprié</li>
            <li>Alors ?... Ne tardez plus !</li>
            <li>Rejoignez-nous...</li>
        </ol>
    </div>
    
    <div id="section_inscription">
        <h2>Inscrivez-vous</h2>
        
        <div class="form-group">
            <input type="email" id="email" name="email", autocomplete="email" placeholder="email" required>
        </div>

        <div class="form-group">
            <input type="text"  id="email" name="username", autocomplete="username" placeholder="nom d'utilisateur" required>
        </div>
        
        <div class="form-group">
            <input type="password" id="password" name="password", autocomplete="current-password" placeholder="Mot de passe" required>
        </div>

        <div class="form-group">
            <input type="password" id="confirm_password" name="password", autocomplete="current-password" placeholder="Confirmer mot de passe" required>
        </div>
        
        <div id="remember-forgot">
            <div class="remember-group">
                <input type="checkbox" id="remember">
                <label for="remember">Se souvenir de moi</label>
            </div>
        </div>
        
        <button id="Inscription">Inscription</button>
        
        <div id="continuer-avec">
            <p>Ou continuer avec</p>
            <div class="social-links">
                <a href="#">Google</a>
                <a href="#">Apple</a>
                <a href="#">LinkedIn</a>
            </div>
        </div>
    </div>
    </body>
</html>
