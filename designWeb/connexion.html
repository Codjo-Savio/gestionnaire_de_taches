<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>GalaxyTasks</title>
    <link rel="stylesheet" href="connexion.css">
</head>
<body>
    <div id="section_slogan">
        <h1>GalaxyTasks</h1>
        <ol>
            <li>Gérez efficacement vos projets</li>
            <li>Structurez vos tâches</li>
            <li>Dans un environnement approprié</li>
            <li>Alors ?... Ne tardez plus !</li>
            <li>Rejoignez-nous...</li>
        </ol>
    </div>
    
    <div id="section_connexion">
        <h2>Connectez-vous</h2>
        
        <div class="form-group">
            <input type="email" id="email" placeholder="Identifiant" required>
        </div>
        
        <div class="form-group">
            <input type="password" id="password" placeholder="Mot de passe" required>
        </div>
        
        <div id="remember-forgot">
            <div class="remember-group">
                <input type="checkbox" id="remember">
                <label for="remember">Se souvenir de moi</label>
            </div>
            <a href="#">Mot de passe oublié ?</a>
        </div>
        
        <button id="connexion">Connexion</button>
        
        <div id="continuer-avec">
            <p>Ou continuer avec</p>
            <div class="social-links">
                <a href="#">Google</a>
                <a href="#">Apple</a>
                <a href="#">LinkedIn</a>
            </div>
        </div>
        
        <div class="signup-link">
            <p>Vous n'avez pas de compte ? <a href="#">Créer un compte</a></p>
        </div>
    </div>
</body>
</html>
