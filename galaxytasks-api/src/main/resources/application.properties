spring.application.name=galaxytasks-api
# Connexion à la base MySQL GalaxyTasks
spring.datasource.url=jdbc:mysql://localhost:3306/GalaxyTasks
spring.datasource.username=ton_utilisateur_mysql
spring.datasource.password=ton_mot_de_passe_mysql

# Driver JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Port du serveur (facultatif)
server.port=8080